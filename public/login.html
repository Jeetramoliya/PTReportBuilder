<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — VAPT Report Builder</title>
<link rel="stylesheet" href="/css/style.css" />
<script src="/js/theme.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="brand-icon">&#128737;</span> VAPT Report Builder</div>
  </div>

  <div class="container" style="max-width:440px; margin-top:48px;">
    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" data-auth-tab="login">Sign in</button>
        <button class="tab-btn" data-auth-tab="signup">Create account</button>
      </div>

      <div class="tab-panel active" id="auth-login">
        <div class="helptext">Sign in to your account. Your projects are private to you.</div>
        <form id="loginForm">
          <div class="form-row">
            <label>Email</label>
            <input type="email" name="email" required autocomplete="email" />
          </div>
          <div class="form-row">
            <label>Password</label>
            <input type="password" name="password" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn" style="width:100%;">Sign in</button>
        </form>
        <div style="margin-top:12px;"><a href="#" id="forgotLink" style="font-size:12.5px;">Forgot your password?</a></div>
        <form id="forgotForm" class="hidden" style="margin-top:12px; border-top:1px solid var(--line); padding-top:12px;" novalidate>
          <div class="form-row">
            <label>Email for reset link</label>
            <input type="email" name="email" required autocomplete="email" />
          </div>
          <button type="submit" class="btn secondary" style="width:100%;">Send reset link</button>
        </form>
      </div>

      <div class="tab-panel" id="auth-signup">
        <div class="helptext">Create your own account — only you can see and edit your projects.</div>
        <form id="signupForm" novalidate>
          <div class="form-row">
            <label>Name</label>
            <input type="text" name="name" placeholder="e.g. Jane Doe" />
          </div>
          <div class="form-row">
            <label>Email</label>
            <input type="email" name="email" required autocomplete="email" />
            <div class="field-error">Enter a valid email address.</div>
          </div>
          <div class="form-row">
            <label>Password</label>
            <input type="password" name="password" required minlength="6" autocomplete="new-password" />
            <div class="field-error">Password must be at least 6 characters.</div>
          </div>
          <button type="submit" class="btn" style="width:100%;">Create account</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
