<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VAPT Report Builder</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="brand-icon">&#128737;</span> VAPT Report Builder</div>
    <div class="row" style="gap:14px;">
      <span id="currentUser" style="color:#cfe0f0; font-size:13px;"></span>
      <a href="#" id="logoutLink">Log out</a>
    </div>
  </div>

  <div class="container">
    <div class="page-header">
      <div>
        <h1>Projects</h1>
        <div class="subtitle">Manage pentest engagements, findings, and generate client-ready PDF reports.</div>
      </div>
      <button class="btn" id="newProjectBtn">+ New Project</button>
    </div>

    <div id="projectsGrid" class="grid"></div>
    <div id="emptyState" class="empty-state hidden">
      <p>No projects yet. Create your first pentest project to get started.</p>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="newProjectModal">
    <div class="modal">
      <h2>New Project</h2>
      <form id="newProjectForm">
        <div class="form-row">
          <label>Project Name *</label>
          <input type="text" name="name" required placeholder="e.g. Acme Web Application" />
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label>Client Name</label>
            <input type="text" name="client_name" placeholder="e.g. Acme Corporation" />
          </div>
          <div class="form-row">
            <label>Client Website</label>
            <input type="text" name="client_website" placeholder="example.com" />
          </div>
        </div>
        <div class="form-row">
          <label>Client Address</label>
          <textarea name="client_address" placeholder="123 Example Street, Suite 100, City, ST 00000"></textarea>
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label>Assessment Date</label>
            <input type="date" name="assessment_date" />
          </div>
          <div class="form-row">
            <label>Finding ID Prefix</label>
            <input type="text" name="finding_prefix" placeholder="WEB" />
          </div>
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label>Tester Name</label>
            <input type="text" name="tester_name" placeholder="e.g. Jane Doe" />
          </div>
          <div class="form-row">
            <label>Prepared By (Org)</label>
            <input type="text" name="prepared_by_org" placeholder="e.g. Your Security Firm" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" id="cancelNewProject">Cancel</button>
          <button type="submit" class="btn">Create Project</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
