# One-click Render blueprint for the FREE tier.
#
# Data lives in a free Turso (libSQL) database, and uploaded images are stored in that
# database too — so no persistent disk is needed and the free instance type works. Set
# DATABASE_URL and DATABASE_AUTH_TOKEN in the Render dashboard (marked sync: false below so
# they are not committed to git). See DEPLOY.md for how to get them.
services:
  - type: web
    name: ptreportbuilder
    runtime: docker
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
